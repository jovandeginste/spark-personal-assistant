assistant:
  file: ./personas/butler.md
  language: English
  name: Spark [test]
user_data:
  names:
    - John Doe
    - Jane Doe
context: |
  John works at BigCo
  John likes to play video games
  Jane is a teacher
  Jane likes to read novels
llm:
  type: ollama
  model: gemma3:1b
  base_url: http://localhost:11434/v1/
matrix:
  default:
    homeserver: https://matrix.org
    username: spark-bot
    password: secretpassword
    room_id: "!roomid:matrix.org"
    database: ./matrix.db
    crypto_passphrase: change-me
webserver:
  default:
    enabled: true
    bind: "127.0.0.1:8080"
    # Set a token to allow access from other hosts:
    # token: change-me
mail:
  default:
    enabled: false
    imap:
      host: imap.example.com
      port: 993
    smtp:
      host: smtp.example.com
      port: 587
    to: recipient@example.com
    username: user@example.com
    password: secretpassword
    folder: INBOX
    use_tls: true
    # Only process email from these senders; leave empty to allow everyone:
    # allowlist:
    #   - sender@example.com
prompts:
  my_prompt: |
    This is a custom prompt.
    It can be multiline.
    You can use it by typing !prompt my_prompt
