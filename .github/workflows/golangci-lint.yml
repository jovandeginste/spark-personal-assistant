name: golangci-lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Test golangci-lint for go-version define in go.mod
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 #v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run golangci-lint via go tool
        run: |
          CGO_ENABLED=0 go tool golangci-lint run --allow-parallel-runners --config=./.golangci.yml --build-tags="goolm,sqlite_foreign_keys"
